name = "grid-aware"
main = "src/platform/cloudflare.ts"
compatibility_date = "2026-08-22"
workers_dev = true

routes = [
  { pattern = "grid.jackcarey.co.uk", custom_domain = true },
  { pattern = "grid-aware.jackcarey.co.uk", custom_domain = true }

]

[assets]
directory = "./public"
binding = "ASSETS"

# Approximates "more than 14 GB regional requests per NESO_CACHE_TTL_SECONDS
# (30 min)" - binding supports 10s/60s windows so this scales
# to ~0.47 req/60s rounded up to the smallest expressible limit.
[[ratelimits]]
name = "GB_REGIONAL_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 1
period = 60
