# Run from a pipeline schedule that fires every 30 minutes. The build falls due daily at 01:00 UTC
# (an example) and runs at the best time within GRID_AWARE_MAX_WAIT_MINUTES.
#
# Needs a shell-executor runner on a machine with a disk: the gate remembers what it has run in a
# file, and shared runners start empty. Install integrations/gate/grid-aware-gate.sh as
# /usr/local/bin/grid-aware-gate, with /var/lib/grid-aware writable by the gitlab-runner user.
nightly-build:
  tags: [self-hosted-shell]
  resource_group: nightly-build # one build at a time
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    GRID_AWARE_API_URL: https://your-grid-aware-api.example.com
    GRID_AWARE_ORIGIN: https://gitlab.example.com
    # London. postcode=SW1A also works.
    GRID_AWARE_QUERY: regionid=13
    GRID_AWARE_MAX_WAIT_MINUTES: "360"
  script:
    - grid-aware-gate run nightly-build --due 01:00 -- sh -c 'echo "heavy work goes here"'
